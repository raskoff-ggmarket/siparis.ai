<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gourmet Garage Sipariş Sistemi</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1923">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sipariş AI">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1923;
  --card: #162030;
  --border: #273548;
  --accent: #ff6b00;
  --text: #eef1f5;
  --dim: #617089;
  --mid: #93a6be;
  --red: #ff5757;
  --yellow: #ffd60a;
  --green: #00d48a;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Outfit',sans-serif; min-height:100vh; }
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-thumb { background:#273548; border-radius:3px; }

.container {
  display:flex; gap:0;
}

/* Sidebar */
.sidebar {
  width:230px; background:var(--card); border-right:1px solid var(--border);
  display:flex; flex-direction:column; min-height:100vh;
  position:fixed; top:0; left:0; height:100vh;
}
.logo-area {
  padding:14px; background:var(--bg); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
}
.logo-area img {
  width:100%; max-width:160px; height:auto; display:block;
}
.nav-list {
  flex:1; padding:12px 0;
}
.nav-item {
  display:flex; align-items:center; gap:10px;
  padding:12px 14px; cursor:pointer;
  color:var(--mid); text-decoration:none;
  transition:all .2s;
  font-size:13px; font-weight:500;
  user-select:none;
}
.nav-item:hover,
.nav-item.active {
  background:rgba(255,107,0,0.1); color:var(--accent);
}

/* Main */
.main {
  flex:1; margin-left:230px; padding:24px;
  max-width:1400px;
}

/* Settings View */
.settings-form {
  background:var(--card); border:1px solid var(--border);
  border-radius:12px; padding:24px; max-width:600px;
}
.form-group {
  margin-bottom:20px;
}
.form-group label {
  display:block; font-size:12px; font-weight:600;
  color:var(--mid); text-transform:uppercase;
  letter-spacing:.5px; margin-bottom:8px;
}
.form-group input,
.form-group textarea {
  width:100%; padding:10px 12px;
  background:rgba(255,255,255,0.03); border:1px solid var(--border);
  border-radius:8px; color:var(--text); font-family:inherit;
  font-size:13px;
}
.form-group textarea {
  font-size:11px; min-height:60px; resize:vertical;
}
.hint {
  font-size:11px; color:var(--dim); margin-top:4px; line-height:1.4;
}
.btn {
  display:inline-flex; align-items:center; gap:7px;
  padding:10px 18px; border-radius:8px; border:none;
  font-size:12px; font-weight:600; cursor:pointer;
  transition:all .2s; text-decoration:none;
  user-select:none;
}
.btn-primary {
  background:var(--accent); color:#fff;
}
.btn-primary:hover {
  background:#ff8c00; box-shadow:0 0 12px rgba(255,107,0,0.3);
}
.btn-secondary {
  background:rgba(255,255,255,0.06); color:var(--mid);
  border:1px solid var(--border);
}
.btn-secondary:hover {
  background:rgba(255,255,255,0.1); color:var(--text);
}
.btn-sm {
  padding:6px 12px; font-size:11px;
}

/* Loading */
.loading {
  display:flex; align-items:center; justify-content:center;
  min-height:300px; gap:12px;
}
.spinner {
  width:20px; height:20px; border:2px solid var(--border);
  border-top-color:var(--accent); border-radius:50%;
  animation:spin .6s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* Result View */
.toolbar {
  display:flex; gap:12px; margin-bottom:20px;
  flex-wrap:wrap; align-items:center;
}
.search-box {
  flex:1; min-width:250px;
  padding:8px 12px; background:rgba(255,255,255,0.03);
  border:1px solid var(--border); border-radius:8px;
  color:var(--text); font-size:12px;
}
.result-table {
  width:100%; border-collapse:collapse;
  background:var(--card); border:1px solid var(--border);
  border-radius:8px; overflow:hidden;
}
.result-table th {
  background:rgba(255,107,0,0.1); padding:12px;
  font-weight:600; font-size:11px; text-align:left;
  text-transform:uppercase; letter-spacing:.5px;
  color:var(--accent); border-bottom:1px solid var(--border);
}
.result-table td {
  padding:12px; border-bottom:1px solid var(--border);
  font-size:12px;
}
.result-table tr:hover {
  background:rgba(255,107,0,0.05);
}
.stock-col {
  font-weight:600; text-align:right;
}
.stock-col.critical {
  color:var(--red);
}
.stock-col.warning {
  color:var(--yellow);
}
.stock-col.ok {
  color:var(--green);
}
.qty-input {
  width:80px; padding:6px 8px;
  background:rgba(255,255,255,0.05); border:1px solid var(--border);
  border-radius:4px; color:var(--text); font-size:12px;
  text-align:right;
}
.action-btns {
  display:flex; gap:8px; margin-bottom:20px;
  flex-wrap:wrap;
}

/* Error */
.error-banner {
  background:rgba(255,87,87,0.1); border:1px solid var(--red);
  border-radius:8px; padding:12px 16px;
  color:var(--red); font-size:12px; margin-bottom:16px;
}
.success-banner {
  background:rgba(0,212,138,0.1); border:1px solid var(--green);
  border-radius:8px; padding:12px 16px;
  color:var(--green); font-size:12px; margin-bottom:16px;
}
</style>
</head>
<body>
<div class="container">
  <aside class="sidebar">
    <div class="logo-area">
      <img src="logo.png" alt="Gourmet Garage">
    </div>
    <nav class="nav-list" id="navList"></nav>
  </aside>

  <main class="main" id="mainContent"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://apis.google.com/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>

<script>
// ═══ STATE ═══
const S = {
  view: 'settings',
  apiKey: localStorage.getItem('gg_apiKey') || '',
  orderSheetId: localStorage.getItem('gg_orderSheetId') || '',
  stockSheetId: localStorage.getItem('gg_stockSheetId') || '',
  salesSheetId: localStorage.getItem('gg_salesSheetId') || '',
  result: [],
  error: '',
  message: '',
};

// ═══ CORE FUNCTIONS ═══
function normalize(str) {
  return String(str).trim().toLowerCase()
    .replace(/[ğğ]/g,'g').replace(/[üü]/g,'u').replace(/[şş]/g,'s')
    .replace(/[ıİ]/g,'i').replace(/[öö]/g,'o').replace(/[çç]/g,'c')
    .replace(/[^a-z0-9]/g,'');
}

function parseNum(v) {
  if (typeof v === 'number') return v;
  let s = String(v).trim().replace(/[%€$₺\s]/gi,'');
  if (/^\d{1,3}(\.\d{3})+(,\d*)?$/.test(s)) s = s.replace(/\./g,'').replace(',','.');
  else s = s.replace(',','.');
  return parseFloat(s) || 0;
}

function autoDetect(rows, fields) {
  const headers = Object.keys(rows[0] || {});
  const map = {};
  const used = new Set();

  // Pass 1: exact match
  fields.forEach(f => {
    const normCands = f.cands.map(normalize);
    const match = headers.find(h => !used.has(h) && normCands.includes(normalize(h)));
    if (match) { map[f.id] = match; used.add(match); }
  });

  // Pass 2: substring match
  fields.forEach(f => {
    if (map[f.id] !== undefined) return;
    const normCands = f.cands.map(normalize);
    const match = headers.find(h => {
      if (used.has(h)) return false;
      const hl = normalize(h);
      return normCands.some(c => hl.includes(c) || c.includes(hl));
    });
    if (match) { map[f.id] = match; used.add(match); }
    else map[f.id] = '__none__';
  });

  // Pass 3: numeric fallback for qty
  fields.filter(f => f.id === 'qty' && !map[f.id]).forEach(f => {
    const sample = rows.slice(0, 20);
    const numeric = headers.find(h => {
      if (used.has(h)) return false;
      const hits = sample.filter(r => { const v = r[h]; return v !== '' && !isNaN(parseFloat(String(v).replace(',','.'))); }).length;
      return hits / Math.max(1,sample.length) >= 0.6;
    });
    if (numeric) { map[f.id] = numeric; used.add(numeric); }
    else map[f.id] = '__none__';
  });

  fields.forEach(f => { if (map[f.id] === undefined) map[f.id] = '__none__'; });
  return map;
}

function buildQtyMap(rows, qtyCol) {
  const map = {};
  rows.forEach(r => {
    const code = String(r.code || '').trim();
    const qty = parseNum(r[qtyCol]);
    if (code && qty > 0) {
      map[code] = (map[code] || 0) + qty;
    }
  });
  return map;
}

function lookupCode(map, code) {
  let match = map[code];
  if (match !== undefined) return match;

  const numCode = parseFloat(code);
  if (!isNaN(numCode)) {
    for (let k in map) {
      if (parseFloat(k) === numCode) return map[k];
    }
  }
  return 0;
}

// ═══ GOOGLE SHEETS API ═══
async function fetchSheet(sheetId, range='A1:ZZ1000') {
  if (!S.apiKey) throw new Error('API key not set');
  if (!sheetId) throw new Error('Sheet ID not set');

  const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${range}?key=${S.apiKey}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Sheet fetch failed: ${res.status}`);

  const data = await res.json();
  if (!data.values || data.values.length < 2) throw new Error('Sheet has no data');

  const headers = data.values[0];
  const rows = data.values.slice(1).map(row => {
    const obj = {};
    headers.forEach((h, i) => { obj[h] = row[i] || ''; });
    return obj;
  });

  return { headers, rows };
}

// ═══ MAIN LOGIC ═══
async function loadAndProcess() {
  S.error = '';
  S.message = '';
  S.view = 'loading';
  render();

  try {
    // Fetch all 3 sheets
    const orderData = await fetchSheet(S.orderSheetId);
    const stockData = await fetchSheet(S.stockSheetId);
    const salesData = await fetchSheet(S.salesSheetId);

    // Auto-detect columns
    const orderFields = [
      { id:'code', cands:['kod','kodlama','ürün kodu','urun kodu','sku','code'] },
      { id:'name', cands:['ad','açıklama','ürün adı','urun adi','name','isim'] },
      { id:'category', cands:['kategori','reyon','tür','tur','tip','group','category'] },
    ];
    const qtyFields = [
      { id:'code', cands:['kod','kodlama','ürün kodu','urun kodu','sku','code'] },
      { id:'qty', cands:['adet','miktar','satış adedi','satis adedi','göcek','gocek','gönderim','gonderim','toplam'] },
    ];

    const orderMaps = autoDetect(orderData.rows, orderFields);
    const stockMaps = autoDetect(stockData.rows, qtyFields);
    const salesMaps = autoDetect(salesData.rows, qtyFields);

    // Build qty maps
    const stockQtyCol = stockMaps.qty;
    const salesQtyCol = salesMaps.qty;

    const stockMap = {};
    const salesMap = {};

    if (stockQtyCol !== '__none__') {
      stockData.rows.forEach(r => {
        const code = String(r[stockMaps.code] || '').trim();
        const qty = parseNum(r[stockQtyCol]);
        if (code) stockMap[code] = qty;
      });
    }

    if (salesQtyCol !== '__none__') {
      salesData.rows.forEach(r => {
        const code = String(r[salesMaps.code] || '').trim();
        const qty = parseNum(r[salesQtyCol]);
        if (code) salesMap[code] = (salesMap[code] || 0) + qty;
      });
    }

    // Fill order form
    S.result = orderData.rows.map(row => {
      const code = String(row[orderMaps.code] || '').trim();
      const name = row[orderMaps.name] || '';
      const cat = row[orderMaps.category] || '';

      return {
        code, name, category: cat,
        stock: lookupCode(stockMap, code),
        sales: lookupCode(salesMap, code),
        originalRow: row,
      };
    });

    S.view = 'result';
    S.message = `${S.result.length} ürün yüklendi`;
  } catch (err) {
    S.error = err.message;
    S.view = 'settings';
  }

  render();
}

function saveSettings() {
  localStorage.setItem('gg_apiKey', S.apiKey);
  localStorage.setItem('gg_orderSheetId', S.orderSheetId);
  localStorage.setItem('gg_stockSheetId', S.stockSheetId);
  localStorage.setItem('gg_salesSheetId', S.salesSheetId);
  S.message = 'Ayarlar kaydedildi';
  setTimeout(() => loadAndProcess(), 500);
}

function exportExcel() {
  const wb = XLSX.utils.book_new();
  const wsData = [['Kod', 'Ürün Adı', 'Kategori', 'Mevcut Stok', 'Satış (Göcek)', 'Sipariş Qty']];

  S.result.forEach(row => {
    wsData.push([
      row.code,
      row.name,
      row.category,
      row.stock,
      row.sales,
      '', // Empty for manual entry
    ]);
  });

  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols'] = [{wch:12}, {wch:30}, {wch:12}, {wch:12}, {wch:12}, {wch:12}];
  XLSX.utils.book_append_sheet(wb, ws, 'Sipariş');

  const today = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `siparis_${today}.xlsx`);
}

async function updateGoogleSheet() {
  S.message = 'Google Sheet\'e yazılıyor...';
  render();

  try {
    // OAuth code would go here (complex flow)
    // For now, show simple message
    S.message = '❌ OAuth henüz entegre edilmedi. Excel indir seçeneğini kullanın.';
    render();
  } catch (err) {
    S.error = err.message;
    render();
  }
}

// ═══ UI RENDER ═══
function render() {
  renderNav();
  renderMain();
}

function renderNav() {
  const nav = document.getElementById('navList');
  nav.innerHTML = `
    <a class="nav-item ${S.view === 'settings' ? 'active' : ''}" onclick="S.view='settings'; render()">
      ⚙️ Ayarlar
    </a>
    <a class="nav-item ${S.view === 'result' ? 'active' : ''}" onclick="S.view='result'; render()" style="${S.result.length === 0 ? 'opacity:.5;pointer-events:none;' : ''}">
      📋 Sipariş
    </a>
  `;
}

function renderMain() {
  const main = document.getElementById('mainContent');

  if (S.view === 'settings') {
    main.innerHTML = `
      <h2 style="margin-bottom:24px; font-size:18px;">Google Sheets Ayarları</h2>
      ${S.error ? `<div class="error-banner">❌ ${S.error}</div>` : ''}
      ${S.message ? `<div class="success-banner">✓ ${S.message}</div>` : ''}

      <div class="settings-form">
        <div class="form-group">
          <label>Google Sheets API Key</label>
          <input type="text" id="apiKey" placeholder="AIzaSy..." value="${S.apiKey}">
          <div class="hint">
            <a href="https://console.cloud.google.com/apis/credentials" target="_blank" style="color:var(--accent);">
              Google Cloud Console
            </a> → Credentials → API Key (public olabilir)
          </div>
        </div>

        <div class="form-group">
          <label>Sipariş Formu Sheet ID</label>
          <textarea id="orderSheetId" placeholder="1ABC...XYZ">${S.orderSheetId}</textarea>
          <div class="hint">Sheet URL'sinden: /spreadsheets/d/<strong>SHEET_ID</strong>/edit</div>
        </div>

        <div class="form-group">
          <label>Stok Sheet ID</label>
          <input type="text" id="stockSheetId" placeholder="1ABC...XYZ" value="${S.stockSheetId}">
        </div>

        <div class="form-group">
          <label>Satış (Göcek) Sheet ID</label>
          <input type="text" id="salesSheetId" placeholder="1ABC...XYZ" value="${S.salesSheetId}">
        </div>

        <button class="btn btn-primary" onclick="
          S.apiKey = document.getElementById('apiKey').value;
          S.orderSheetId = document.getElementById('orderSheetId').value;
          S.stockSheetId = document.getElementById('stockSheetId').value;
          S.salesSheetId = document.getElementById('salesSheetId').value;
          saveSettings();
        ">
          💾 Kaydet ve Yükle
        </button>
      </div>
    `;
  } else if (S.view === 'loading') {
    main.innerHTML = `
      <div class="loading">
        <div class="spinner"></div>
        <div>Veriler yükleniyor...</div>
      </div>
    `;
  } else if (S.view === 'result') {
    main.innerHTML = `
      ${S.error ? `<div class="error-banner">❌ ${S.error}</div>` : ''}
      ${S.message ? `<div class="success-banner">✓ ${S.message}</div>` : ''}

      <div class="action-btns">
        <button class="btn btn-primary" onclick="exportExcel()">
          📥 Excel İndir
        </button>
        <button class="btn btn-secondary" onclick="S.view='settings'; render()">
          ⚙️ Ayarları Düzenle
        </button>
      </div>

      <div style="margin-bottom:12px;">
        <input class="search-box" type="text" id="searchBox" placeholder="Ürün adı veya kod ara..."
          onkeyup="filterTable()">
      </div>

      <table class="result-table">
        <thead>
          <tr>
            <th style="width:15%">Kod</th>
            <th style="width:35%">Ürün Adı</th>
            <th style="width:20%">Kategori</th>
            <th style="width:10%; text-align:right">Stok</th>
            <th style="width:10%; text-align:right">Satış</th>
            <th style="width:10%; text-align:right">Sipariş</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    `;

    renderResultTable();
  }
}

function renderResultTable() {
  const tbody = document.getElementById('tableBody');
  const search = (document.getElementById('searchBox')?.value || '').toLowerCase();

  const filtered = S.result.filter(row =>
    !search || row.code.toLowerCase().includes(search) ||
    row.name.toLowerCase().includes(search)
  );

  tbody.innerHTML = filtered.map((row, i) => {
    const stockClass = row.stock < 0 ? 'critical' : row.stock === 0 ? 'warning' : 'ok';
    return `
      <tr>
        <td>${escapeHtml(row.code)}</td>
        <td>${escapeHtml(row.name)}</td>
        <td>${escapeHtml(row.category)}</td>
        <td class="stock-col ${stockClass}">${row.stock}</td>
        <td style="text-align:right">${row.sales}</td>
        <td><input class="qty-input" type="number" id="qty_${i}" min="0" value=""></td>
      </tr>
    `;
  }).join('');
}

function filterTable() {
  renderResultTable();
}

function escapeHtml(text) {
  const map = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'':'&#39;' };
  return String(text).replace(/[&<>"']/g, m => map[m]);
}

// ═══ INIT ═══
window.addEventListener('load', () => {
  render();
});
</script>
</body>
</html>
